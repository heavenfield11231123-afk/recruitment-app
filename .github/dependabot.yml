# 依存関係の脆弱性修正・更新を自動で PR にする（security-console の週次スキャンと連動）
# - セキュリティ修正は脆弱性が公開され次第すぐに PR が作られる
# - 通常の更新は週 1 回（月曜 07:00 JST）にまとめて 1 本の PR にする
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["*"]
